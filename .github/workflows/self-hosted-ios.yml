# Builds the fork's iPhone app as WeHex (team 26DMRHRW6Z, dev.whexy.hex) and
# sends every good build of dev to TestFlight. See .github/operations.md.
#
# - Pull requests into dev (and dispatches on other branches) run `check`:
#   identity rewrite, unit tests and an unsigned archive on a GitHub-hosted
#   Mac, with no secrets. They never publish.
# - A push to dev whose iOS inputs changed since the last fork-ios/<n> tag runs
#   `testflight`: the same checks, then a signed archive, then the upload, but
#   only while dev still points at the run's commit. A newer push publishes
#   itself. The `tag` job then tags the commit fork-ios/<run_number>.
# - A dispatch on dev runs `testflight` whatever changed; with upload=false it
#   signs and exports without uploading.
#
# The build number is run_number, so never rename this file (run_number counts
# per workflow file) and never "Re-run": retry with workflow_dispatch.
name: self-hosted-ios

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (dev only); off signs and exports without uploading
        type: boolean
        default: false

# A newer pending publish replaces an older one, never a running one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ios-pr-{0}', github.event.pull_request.number) || format('ios-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUILD_NUMBER: ${{ github.run_number }}
  # Paths that change the app. ios/ includes ios/fork/.
  IOS_INPUTS: ios app/AppIcon.icon tests/fixtures/vocabulary/audio/term-hex-1.wav .github/workflows/self-hosted-ios.yml

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          changed() { ! git diff --quiet "$1" HEAD -- $IOS_INPUTS; }
          if [[ $EVENT == pull_request ]]; then
            # HEAD is the merge commit; its first parent is dev.
            if changed HEAD^1; then mode=check; else mode=skip; why="no iOS change"; fi
          elif [[ $GITHUB_REF != refs/heads/dev ]]; then
            mode=check
          elif [[ $EVENT == workflow_dispatch ]]; then
            if [[ $UPLOAD == true ]]; then mode=upload; else mode=export; fi
          else
            last=$(git tag -l 'fork-ios/*' | sort -t/ -k2 -n | tail -1)
            if [[ -z $last ]] || changed "$last"; then mode=upload; else mode=skip; why="no iOS change since $last"; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "plan: mode=$mode${why:+ ($why)} commit=$GITHUB_SHA"
          if [[ $mode == skip ]]; then
            echo "state=NOOP($why) commit=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

  # No secrets and no environment: safe for any pull request, including ones
  # from forks. Always a GitHub-hosted Mac, whatever IOS_RUNNER says.
  check:
    needs: plan
    if: needs.plan.outputs.mode == 'check'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        if: vars.IOS_XCODE != ''
        env:
          IOS_XCODE: ${{ vars.IOS_XCODE }}
        run: sudo xcode-select -s "$IOS_XCODE"
      - name: Prepare
        run: bash ios/fork/ci.sh prepare
      - name: Test
        run: bash ios/fork/ci.sh test
      - name: Archive (unsigned)
        run: bash ios/fork/ci.sh archive-unsigned
      - if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          if [[ $RESULT == success ]]; then state=CHECKED; else state="FAILED(check)"; fi
          echo "state=$state build=$BUILD_NUMBER commit=$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  testflight:
    needs: plan
    # Belt and braces: the plan never asks for these on a pull request, and the
    # testflight environment only admits dev.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
      && (needs.plan.outputs.mode == 'upload' || needs.plan.outputs.mode == 'export')
    runs-on: ${{ fromJSON(vars.IOS_RUNNER || '"macos-26"') }}
    environment: testflight
    timeout-minutes: 150
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    env:
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - name: Check this run may publish
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DEVELOPMENT_P12: ${{ secrets.IOS_DEVELOPMENT_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          echo "stage=setup" >> "$GITHUB_ENV"
          if ((GITHUB_RUN_ATTEMPT > 1)); then
            echo "::error::Re-runs reuse run_number, and with it the build number. Retry with: gh workflow run self-hosted-ios.yml --ref dev -f upload=true"
            exit 1
          fi
          missing=()
          for name in IOS_DISTRIBUTION_P12 IOS_DEVELOPMENT_P12 IOS_P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [[ -n ${!name} ]] || missing+=("$name")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::The testflight environment lacks: ${missing[*]}. Nothing was built. See .github/operations.md."
            echo "stage=secrets" >> "$GITHUB_ENV"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        if: vars.IOS_XCODE != ''
        env:
          IOS_XCODE: ${{ vars.IOS_XCODE }}
        run: sudo xcode-select -s "$IOS_XCODE"

      - name: Prepare
        run: |
          echo "stage=prepare" >> "$GITHUB_ENV"
          bash ios/fork/ci.sh prepare

      - name: Test
        run: |
          echo "stage=test" >> "$GITHUB_ENV"
          bash ios/fork/ci.sh test

      - name: Import signing credentials
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DEVELOPMENT_P12: ${{ secrets.IOS_DEVELOPMENT_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          echo "stage=signing" >> "$GITHUB_ENV"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for p12 in "$IOS_DEVELOPMENT_P12" "$IOS_DISTRIBUTION_P12"; do
            base64 --decode <<< "$p12" > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$IOS_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          done
          rm "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Only the count: the log is public, and identities carry a person's name.
          security find-identity -v -p codesigning "$keychain" | tail -1
          umask 077
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "stage=archive" >> "$GITHUB_ENV"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" bash ios/fork/ci.sh archive

      - name: Check dev still points here
        id: current
        if: env.MODE == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "stage=gate" >> "$GITHUB_ENV"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          if [[ $head == "$GITHUB_SHA" ]]; then
            echo current=true >> "$GITHUB_OUTPUT"
          else
            echo "state=SUPERSEDED build=$BUILD_NUMBER commit=$GITHUB_SHA head=$head" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Export
        if: env.MODE == 'export'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "stage=export" >> "$GITHUB_ENV"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" bash ios/fork/ci.sh export export
          echo "state=EXPORTED build=$BUILD_NUMBER commit=$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        id: upload
        if: steps.current.outputs.current == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "stage=upload" >> "$GITHUB_ENV"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" bash ios/fork/ci.sh export upload
          echo uploaded=true >> "$GITHUB_OUTPUT"
          version=$(sed -nE 's/^ +MARKETING_VERSION: //p' ios/project.yml | head -1)
          echo "state=UPLOADED version=$version build=$BUILD_NUMBER commit=$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: echo "state=FAILED(${stage:-setup}) build=$BUILD_NUMBER commit=$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/identity.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true

  # A tag keeps the uploaded commit after the next force-push, and is the base
  # the next push compares its iOS inputs with.
  tag:
    needs: testflight
    if: needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="fork-ios/$BUILD_NUMBER"
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f object="$GITHUB_SHA" -f type=commit \
            -f message="WeHex TestFlight build $BUILD_NUMBER" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" > /dev/null
          echo "tag: $tag -> $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
